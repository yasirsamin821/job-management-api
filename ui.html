<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Management</title>
<style>
:root{--bg:#edf0f5;--surface:#fff;--ink:#14213d;--muted:#5d6985;--line:#d9deea;--accent:#2f5bea;--accent-ink:#fff;--danger:#c0262d;--row:#f5f7fb;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#161e33;--ink:#e6eaf5;--muted:#8f9bb8;--line:#27324f;--accent:#7b9cff;--accent-ink:#0b1230;--danger:#ff8a8f;--row:#1b2540;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-ink)}
.sp{flex:1}
main{max-width:1100px;margin:24px auto;padding:0 24px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px;flex:1;letter-spacing:-.01em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar input{width:220px}
button.b{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.d{color:var(--danger)}
button.s{padding:4px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;max-width:320px;overflow-wrap:anywhere}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--row)}
td.act{white-space:nowrap;text-align:right}
.muted{color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(480px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(8,12,28,.55)}
dialog h3{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
label small{font-weight:400;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
pre{background:var(--row);padding:12px;border-radius:8px;overflow:auto;font-size:13px;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;max-width:90vw;z-index:9}
#toast.err{background:var(--danger);color:#fff}
.who{font-size:13px;color:var(--muted)}
.conn{display:flex;gap:6px;align-items:center}.conn input{width:210px;padding:6px 8px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Job Management</h1>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <div class="conn"><input id="base" aria-label="API address" spellcheck="false"><button class="b s" id="reconnect">Connect</button></div>
  <span class="who" id="who"></span>
  <button class="b s" id="auth"></button>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=store.get('jm_token'),SPEC=null,VIEW='jobs',ROWS=[],FILTER='';
$('#base').value=store.get('jm_base')||'http://127.0.0.1:8000';
const base=()=>$('#base').value.replace(/\/+$/,'');

const RES={
  jobs:{label:'Jobs',path:'/jobs/',create:'JobCreate',update:'JobUpdate',resp:'JobResponse',one:'job'},
  users:{label:'Users',path:'/users/',create:'UserCreate',update:'UserUpdate',resp:'UserResponse',one:'user'},
  files:{label:'Files',resp:'FileResponse'}
};

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2500)}
function errMsg(d,status){
  if(d&&d.detail){if(typeof d.detail==='string')return d.detail;if(Array.isArray(d.detail))return d.detail.map(x=>(x.loc?x.loc.slice(1).join('.')+': ':'')+x.msg).join('; ')}
  return 'Request failed ('+status+')';
}
async function api(path,o={}){
  const h={};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let body;
  if(o.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.json)}
  else if(o.form)body=new URLSearchParams(o.form);
  else if(o.data)body=o.data;
  const r=await fetch(base()+path,{method:o.method||'GET',headers:h,body});
  if(o.raw&&r.ok)return r;
  const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}
  if(r.status===401){setToken(null);}
  if(!r.ok)throw new Error(errMsg(d,r.status));
  return d;
}

/* ---------- schema helpers ---------- */
const schemas=()=>(SPEC&&SPEC.components&&SPEC.components.schemas)||{};
function sch(name){return schemas()[name]||{properties:{}}}
function resolve(s){
  if(!s)return{};
  if(s.$ref)return resolve(schemas()[s.$ref.split('/').pop()]);
  const alt=s.anyOf||s.oneOf;
  if(alt){const nn=alt.filter(x=>x.type!=='null');if(nn.length)return{...resolve(nn[0]),title:s.title,default:s.default}}
  return s;
}
function findPath(ref){
  if(!SPEC)return null;
  for(const [p,ops] of Object.entries(SPEC.paths||{}))for(const op of Object.values(ops))
    if(op&&op.requestBody&&JSON.stringify(op.requestBody).includes('/'+ref+'"'))return p;
  return null;
}

/* ---------- forms ---------- */
function fieldHtml(name,s0,required,val){
  const s=resolve(s0),id='f_'+name,t=s.title||name.replace(/_/g,' ');
  const lab=`<label for="${id}">${esc(t)}${required?'':' <small>optional</small>'}</label>`;
  let v=val??s0.default??s.default;
  if(s.enum)return lab+`<select id="${id}" data-f="${name}" data-t="enum"><option value=""></option>${s.enum.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(s.type==='boolean')return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${id}" data-f="${name}" data-t="bool" ${v?'checked':''}> ${esc(t)}</label>`;
  if(s.type==='integer'||s.type==='number')return lab+`<input id="${id}" type="number" step="${s.type==='integer'?1:'any'}" data-f="${name}" data-t="num" value="${esc(v)}" ${required?'required':''}>`;
  if(s.type==='object'||s.type==='array')return lab+`<textarea id="${id}" rows="3" data-f="${name}" data-t="json" spellcheck="false">${v==null?'':esc(JSON.stringify(v))}</textarea>`;
  const pw=s.format==='password'||/password/i.test(name);
  const type=pw?'password':s.format==='email'||name==='email'?'email':'text';
  const long=/description|notes|details|body/i.test(name);
  if(long&&!pw)return lab+`<textarea id="${id}" rows="4" data-f="${name}" data-t="str" ${required?'required':''}>${esc(v)}</textarea>`;
  return lab+`<input id="${id}" type="${type}" data-f="${name}" data-t="str" value="${pw?'':esc(v)}" ${required?'required':''} ${pw?'autocomplete="new-password"':''}>`;
}
function formHtml(schemaName,values={}){
  const s=sch(schemaName),req=s.required||[];
  return Object.entries(s.properties||{}).map(([n,p])=>fieldHtml(n,p,req.includes(n),values[n])).join('');
}
function collect(form){
  const out={};
  form.querySelectorAll('[data-f]').forEach(el=>{
    const k=el.dataset.f,t=el.dataset.t;
    if(t==='bool'){out[k]=el.checked;return}
    const v=el.value.trim();if(v==='')return;
    if(t==='num')out[k]=Number(v);
    else if(t==='json'){try{out[k]=JSON.parse(v)}catch{throw new Error(k+' must be valid JSON')}}
    else out[k]=el.value;
  });
  return out;
}
function modal(title,inner,onSubmit,submitLabel='Save'){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog" id="mf"><h3>${esc(title)}</h3>${inner}<div class="row"><button type="button" class="b" id="mc">Cancel</button><button class="b p" id="ms">${esc(submitLabel)}</button></div></form>`;
  $('#mc').onclick=()=>d.close();
  $('#mf').onsubmit=async e=>{
    e.preventDefault();$('#ms').disabled=true;
    try{await onSubmit($('#mf'));d.close()}catch(x){toast(x.message,true)}
    finally{const b=$('#ms');if(b)b.disabled=false}
  };
  d.showModal();
}

/* ---------- auth ---------- */
function setToken(t){TOKEN=t;store.set('jm_token',t);drawHeader()}
function drawHeader(){
  $('#auth').textContent=TOKEN?'Sign out':'Sign in';
  $('#who').textContent=TOKEN?'Signed in':'';
}
function authDialog(){
  const d=$('#dlg');let mode='login';
  const draw=()=>{
    d.innerHTML=`<form id="af"><h3>${mode==='login'?'Sign in':'Create account'}</h3>
    <div class="tabs"><button type="button" class="b s ${mode==='login'?'p':''}" data-m="login">Sign in</button><button type="button" class="b s ${mode==='register'?'p':''}" data-m="register">Register</button></div>
    ${mode==='login'?`<label for="u">Username or email</label><input id="u" required autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">`:formHtml('UserRegister')}
    <div class="row"><button type="button" class="b" id="ac">Cancel</button><button class="b p">${mode==='login'?'Sign in':'Create account'}</button></div></form>`;
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    $('#ac').onclick=()=>d.close();
    $('#af').onsubmit=async e=>{
      e.preventDefault();
      try{
        if(mode==='login'){
          const r=await api(findPath('Body_login_user_auth_login_post')||'/auth/login',{method:'POST',form:{username:$('#u').value,password:$('#pw').value}});
          setToken(r.access_token);d.close();toast('Signed in');show(VIEW);
        }else{
          const data=collect($('#af'));
          await api(findPath('UserRegister')||'/auth/register',{method:'POST',json:data});
          toast('Account created. Sign in to continue.');mode='login';draw();
        }
      }catch(x){toast(x.message,true)}
    };
  };
  draw();d.showModal();
}

/* ---------- views ---------- */
function cell(v){
  if(v===null||v===undefined||v==='')return '<span class="muted">–</span>';
  if(typeof v==='boolean')return v?'Yes':'No';
  if(typeof v==='object')return esc(JSON.stringify(v));
  if(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v)){const d=new Date(v);if(!isNaN(d))return esc(d.toLocaleString())}
  return esc(v);
}
function colsFor(respName,rows){
  let c=Object.keys(sch(respName).properties||{});
  if(!c.length&&rows[0])c=Object.keys(rows[0]);
  return c.filter(k=>!/password|hash/i.test(k));
}
function table(rows,cols,actions){
  const f=FILTER.toLowerCase();
  const shown=f?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(f)):rows;
  if(!shown.length)return `<div class="card"><div class="empty">${rows.length?'No matches for that search.':'Nothing here yet.'}</div></div>`;
  return `<div class="card"><table><thead><tr>${cols.map(c=>`<th>${esc((resolve(sch(RES[VIEW].resp).properties?.[c]).title)||c.replace(/_/g,' '))}</th>`).join('')}<th></th></tr></thead><tbody>${shown.map(r=>`<tr>${cols.map(c=>`<td>${cell(r[c])}</td>`).join('')}<td class="act">${actions(r)}</td></tr>`).join('')}</tbody></table></div>`;
}
function bar(title,extra){
  return `<div class="bar"><h2>${esc(title)}</h2><input id="q" type="search" placeholder="Search" aria-label="Search" value="${esc(FILTER)}">${extra}</div>`;
}
function bindSearch(redraw){const q=$('#q');q.oninput=()=>{FILTER=q.value;redraw();const n=$('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
function asList(d){return Array.isArray(d)?d:(d&&(d.items||d.results||d.data))||[]}

async function show(name){
  VIEW=name;FILTER=$('#q')&&VIEW===name?FILTER:'';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===name));
  const m=$('#main');
  if(!SPEC){m.innerHTML='<div class="empty">Can’t reach the API. Check the address above and that the server is running with CORS enabled.</div>';return}
  if(!TOKEN){m.innerHTML='<div class="empty">Sign in to manage jobs, users and files.<br><br><button class="b p" id="go">Sign in</button></div>';$('#go').onclick=authDialog;return}
  m.innerHTML='<div class="empty">Loading…</div>';
  try{
    if(name==='files')return await showFiles();
    ROWS=asList(await api(RES[name].path));
    draw();
  }catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`;if(TOKEN)toast(e.message,true)}
}
function draw(){
  const r=RES[VIEW],m=$('#main');
  const cols=colsFor(r.resp,ROWS);
  m.innerHTML=bar(r.label,`<button class="b p" id="new">New ${r.one}</button>`)+table(ROWS,cols,row=>`<button class="b s" data-a="edit" data-id="${esc(row.id)}">Edit</button> <button class="b s d" data-a="del" data-id="${esc(row.id)}">Delete</button>`);
  bindSearch(draw);
  $('#new').onclick=()=>modal('New '+r.one,formHtml(r.create),async f=>{await api(r.path,{method:'POST',json:collect(f)});toast('Created');show(VIEW)},'Create');
}
$('#main').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const r=RES[VIEW],id=b.dataset.id,a=b.dataset.a;
  if(a==='edit'){
    const row=ROWS.find(x=>String(x.id)===id);
    modal('Edit '+r.one,formHtml(r.update,row),async f=>{await api(r.path+id,{method:'PUT',json:collect(f)});toast('Saved');show(VIEW)});
  }else if(a==='del'){
    modal('Delete '+r.one+'?',`<p class="muted">This permanently removes ${r.one} ${esc(id)}.</p>`,async()=>{await api(r.path+id,{method:'DELETE'});toast('Deleted');show(VIEW)},'Delete');
    $('#ms').classList.add('d');
  }else if(a==='open'){
    try{
      const res=await api('/files/'+id,{raw:true});
      const ct=res.headers.get('content-type')||'';
      if(ct.includes('json')){const j=await res.json();modal('File '+id,`<pre>${esc(JSON.stringify(j,null,2))}</pre>`,async()=>{},'Close')}
      else{const blob=await res.blob();window.open(URL.createObjectURL(blob),'_blank')}
    }catch(x){toast(x.message,true)}
  }
});

async function showFiles(){
  ROWS=asList(await api('/files/'));
  const m=$('#main'),cols=colsFor('FileResponse',ROWS);
  const draw=()=>{
    m.innerHTML=bar('Files',`<button class="b p" id="up">Upload file</button>`)+table(ROWS,cols,row=>`<button class="b s" data-a="open" data-id="${esc(row.id)}">Open</button>`);
    bindSearch(draw);
    $('#up').onclick=()=>modal('Upload file','<label for="fi">Choose a file</label><input id="fi" type="file" required>',async()=>{
      const file=$('#fi').files[0];if(!file)throw new Error('Choose a file first');
      const prop=Object.keys(sch('Body_upload_file_files_upload_post').properties||{})[0]||'file';
      const fd=new FormData();fd.append(prop,file);
      await api('/files/upload',{method:'POST',data:fd});toast('Uploaded');show('files');
    },'Upload');
  };
  draw();
}

/* ---------- boot ---------- */
async function connect(){
  store.set('jm_base',base());
  try{
    const r=await fetch(base()+'/openapi.json');
    SPEC=await r.json();
    const t=SPEC.info&&SPEC.info.title;if(t)document.title=t;
  }catch{SPEC=null;toast('Could not reach '+base(),true)}
  show(VIEW);
}
$('#nav').innerHTML=Object.entries(RES).map(([k,v])=>`<button data-v="${k}">${v.label}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){FILTER='';show(b.dataset.v)}};
$('#reconnect').onclick=connect;
$('#auth').onclick=()=>{if(TOKEN){setToken(null);show(VIEW)}else authDialog()};
drawHeader();connect();
</script>
</body>
</html>
